<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的待办清单</title>
  <style>
    /* ==================== CSS 部分：负责"皮肤" ==================== */
    /* 主题变量：改这里就能换整站配色 —— 但变量名是语义契约：
       muted = 需要弱化的文字，danger = 警示/悬停色；改之前先搜 var(--x) 看它管着哪些元素 */
    :root {
      --accent: #a174e0;
      --bg: #d5dcf8;
      --card: #eaf6fd;
      --text: #2b2f3a;
      --muted: #8a85a3;
      --danger: #e8a33d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }

    .app {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .06);
    }

    h1 { font-size: 24px; }
    .subtitle { color: var(--muted); font-size: 13px; margin: 6px 0 20px; }

    /* 输入区用 flex 横向排列：输入框占满剩余空间 */
    .todo-form { display: flex; gap: 8px; }
    .todo-form input {
      flex: 1;
      border: 1.5px solid #e4e6ee;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
    }
    .todo-form input:focus { border-color: var(--accent); }
    .todo-form button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 14px;
      cursor: pointer;
    }
    .todo-form button:hover { opacity: .9; }

    .filters { display: flex; gap: 8px; margin: 18px 0 12px; }
    .filter {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
    }
    .filter.active { background: var(--accent); color: #fff; }

    .todo-list { list-style: none; }
    .todo-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 4px;
      border-bottom: 1px solid #f0f1f5;
    }
    .todo-item .todo-text { flex: 1; font-size: 15px; }
    .todo-item.done .todo-text { text-decoration: line-through; color: var(--muted); }
    .todo-item .delete {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 18px;
      cursor: pointer;
      visibility: hidden;
    }
    .todo-item:hover .delete { visibility: visible; color: var(--danger); }

    .todo-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      font-size: 13px;
      color: var(--muted);
    }
    .todo-footer button {
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
    }
    .todo-footer button:hover { color: var(--danger); }
  </style>
</head>
<body>
  <!-- ==================== HTML 部分：负责"骨架" ==================== -->
  <main class="app">
    <h1>📋 今日待办</h1>
    <p class="subtitle">单文件版：HTML + CSS + JS 都在这个文件里，双击即用</p>

    <!-- 输入区：一个输入框 + 一个按钮 -->
    <form id="todo-form" class="todo-form">
      <input id="todo-input" type="text" placeholder="今天要做什么？" autocomplete="off">
      <button type="submit">添加</button>
    </form>

    <!-- 过滤条 -->
    <div class="filters">
      <button type="button" class="filter active" data-filter="all">全部</button>
      <button type="button" class="filter" data-filter="active">未完成</button>
      <button type="button" class="filter" data-filter="done">已完成</button>
    </div>

    <!-- 列表区：里面的内容由 JS 动态生成 -->
    <ul id="todo-list" class="todo-list"></ul>

    <!-- 底部状态栏 -->
    <footer class="todo-footer">
      <span id="todo-count">还剩 0 项</span>
      <button type="button" id="clear-done">清除已完成</button>
    </footer>
  </main>

  <script>
    // ==================== JS 部分：负责"肌肉" ====================

    // 存储封装：有些环境（比如预览面板的 iframe）会禁用 localStorage，
    // 用 try/catch 包住——禁用时页面照常能用，只是刷新后不保存
    const storage = {
      load() {
        try { return JSON.parse(localStorage.getItem('todos') || '[]'); }
        catch (e) { return []; }
      },
      save(data) {
        try { localStorage.setItem('todos', JSON.stringify(data)); } catch (e) {}
      }
    };

    // ===== 数据层：待办存在内存数组里，storage 负责刷新后恢复 =====
    let todos = storage.load();
    let currentFilter = 'all';

    // ===== 渲染层：数据 -> 界面。数据每变一次，整个列表重画一次 =====
    // 这就是前端最核心的心智模型：你只负责改数据，画面交给 render()
    function render() {
      const list = document.getElementById('todo-list');
      list.innerHTML = '';

      const visible = todos.filter(t => {
        if (currentFilter === 'active') return !t.done;
        if (currentFilter === 'done') return t.done;
        return true;
      });

      visible.forEach(todo => {
        const li = document.createElement('li');
        li.className = 'todo-item' + (todo.done ? ' done' : '');
        li.innerHTML = `
          <input type="checkbox" ${todo.done ? 'checked' : ''} data-id="${todo.id}">
          <span class="todo-text">${escapeHtml(todo.text)}</span>
          <button type="button" class="delete" data-id="${todo.id}">×</button>
        `;
        list.appendChild(li);
      });

      const left = todos.filter(t => !t.done).length;
      document.getElementById('todo-count').textContent = `还剩 ${left} 项`;

      storage.save(todos);
    }

    // 转义用户输入，防止把待办文字写成 HTML 标签执行（安全好习惯）
    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // ===== 事件层：界面 -> 数据。用户在页面上的每个操作，最终都是改 todos 数组 =====

    // 添加：表单提交（回车和点按钮都算提交）
    document.getElementById('todo-form').addEventListener('submit', e => {
      e.preventDefault();
      const input = document.getElementById('todo-input');
      const text = input.value.trim();
      if (!text) return;
      todos.push({ id: Date.now(), text, done: false });
      input.value = '';
      render();
    });

    // 勾选 / 删除：事件委托——整个列表只挂一个监听，靠 data-id 找到是哪一条
    document.getElementById('todo-list').addEventListener('click', e => {
      const id = Number(e.target.dataset.id);
      if (e.target.type === 'checkbox') {
        const todo = todos.find(t => t.id === id);
        if (todo) { todo.done = !todo.done; render(); }
      } else if (e.target.classList.contains('delete')) {
        todos = todos.filter(t => t.id !== id);
        render();
      }
    });

    // 过滤
    document.querySelectorAll('.filter').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    // 清除已完成
    document.getElementById('clear-done').addEventListener('click', () => {
      todos = todos.filter(t => !t.done);
      render();
    });

    render(); // 首次渲染：页面一打开就把已有待办画出来
  </script>
</body>
</html>
